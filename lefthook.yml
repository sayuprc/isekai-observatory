# Lefthook pre-commit hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    api-ecs:
      root: "src/app/server/"
      glob: "{app,bootstrap,config,database,packages,routes,tests,tools}/**/*.php"
      run: mise run api:ecs -- {staged_files}

    api-phpstan:
      root: "src/app/server/"
      glob: "{app,bootstrap,packages}/**/*.php"
      run: mise run api:phpstan -- {staged_files}

    admin-lint:
      root: "src/app/admin/"
      glob: "src/app/**/*.{ts,tsx,js,jsx,mjs,astro}"
      run: mise run admin:lint

    admin-style:
      root: "src/app/admin/"
      glob: "src/app/**/*.{css,astro}"
      run: mise run admin:style -- {staged_files}

    admin-format:
      root: "src/app/admin/"
      glob: "src/app/admin/**/*.{ts,tsx,js,mjs,astro,css,json,jsonc}"
      run: ./node_modules/.bin/prettier --check {staged_files}

    contracts-format:
      root: "src/app/"
      glob: "contracts/src/**/*.tsp"
      run: mise run contract:format:check

    contracts-test:
      root: "src/app/"
      glob: "contracts/scripts/**/*.ts"
      run: mise run contract:test
