[tools]
atlas = "1.3.0"
bun = "1.4.2"
lefthook = "2.1.14"
mago = "1.49.0"
mkcert = "1.4.4"
node = "24.21.0"
pnpm = "12.4.1"

[vars]
# moonc の version 文字列 (moon version --all の moonc 行)
moonbit_version = "0.10.6+80dc50f24"
uid = "`id -u`"
user_name = "`id -un`"
gid = "`id -g`"
group_name = "`id -gn`"

[env]
SERVER_IMAGE = "isekai-observatory-api:local"
PROXY_IMAGE = "isekai-observatory-proxy:local"
OPENAPI_IMAGE = "openapi-generator:local"
MYSQL_IMAGE = "isekai-observatory-mysql:local"
NODE_EXTRA_CA_CERTS = "{{config_root}}/infra/local/docker/php/certs/rootCA.pem"
ADMIN_OAS_FILE = "IsekaiObservatory.Admin.v1.yaml"
VIEWER_OAS_FILE = "IsekaiObservatory.Viewer.v1.yaml"

# -- 環境構築 / コンテナ --

[tasks.setup]
description = "環境構築をする"
run = [
  { task = "cert:make" },
  { task = "cert:copy-pem" },
  { task = "build" },
  { tasks = ["api:composer:install", "pnpm:install"] },
  { task = "up" },
  "lefthook install",
]

[tasks.build]
description = "開発環境向けの Docker イメージをビルドする"
depends = "build:*"

[tasks."build:proxy"]
description = "Nginx のイメージをビルドする"
run = "docker build -t ${PROXY_IMAGE} ./infra/local/docker/nginx"

[tasks."build:php"]
description = "PHP のイメージをビルドする"
run = '''
docker build -t ${SERVER_IMAGE} ./infra/local/docker/php \
  --build-arg UID={{vars.uid}} \
  --build-arg GID={{vars.gid}} \
  --build-arg USERNAME={{vars.user_name}} \
  --build-arg GROUPNAME={{vars.group_name}}
'''

[tasks."build:openapi-generator"]
description = "OpenAPI Generator のイメージをビルドする"
run = '''
docker build -t ${OPENAPI_IMAGE} ./infra/local/docker/openapi-generator \
  --build-arg UID={{vars.uid}} \
  --build-arg GID={{vars.gid}} \
  --build-arg USERNAME={{vars.user_name}} \
  --build-arg GROUPNAME={{vars.group_name}}
'''

[tasks."build:mysql"]
description = "MySQL のイメージをビルドする"
run = "docker build -t ${MYSQL_IMAGE} ./infra/local/docker/mysql"

[tasks.up]
description = "コンテナを起動する"
run = "docker compose up -d"

[tasks.down]
description = "コンテナを削除する"
run = "docker compose down"

[tasks."cert:make"]
description = "自己署名証明書を作成する"
run = '''
mkcert \
  --key-file infra/local/docker/nginx/certs/server.key \
  --cert-file infra/local/docker/nginx/certs/server.crt \
  localhost \
  127.0.0.1 \
  local.admin.isekaijoucho.fan \
  local.api.isekaijoucho.fan \
  local.isekaijoucho.fan
'''

[tasks."cert:copy-pem"]
description = "rootCA.pem をコピーする"
run = '''
caroot_pem=$(mkcert -CAROOT)/rootCA.pem
cp ${caroot_pem} infra/local/docker/php/certs/
'''

[tasks."pnpm:install"]
description = "pnpm のパッケージをインストールする"
dir = "src/app"
run = "pnpm install --frozen-lockfile"

# -- worktree --

[tasks."worktree:init"]
description = "worktree ごとのローカル実行設定を生成し、開発環境を起動する"
run = '''
./tools/worktree/init.sh
mise run up
mise run api:composer:install
mise run pnpm:install
'''

[tasks."worktree:status"]
description = "現在の worktree に割り当てられたポートと URL を表示する"
run = "./tools/worktree/init.sh --status"

# -- contract --

[tasks."contract:format"]
description = "TypeSpec をフォーマットする"
dir = "src/app"
run = "bun --filter contracts format"

[tasks."contract:format:check"]
description = "TypeSpec のフォーマットを検証する"
dir = "src/app"
run = "bun --filter contracts format:check"

[tasks."contract:test"]
description = "contracts のテストを実行する"
dir = "src/app"
run = "bun --filter contracts test"

[tasks."contract:compile:all"]
description = "contracts の OAS を一括生成する"
depends = ["contract:compile:viewer", "contract:compile:admin"]

[tasks."contract:compile:viewer"]
description = "Viewer 用 OAS を生成する"
dir = "src/app"
run = "bun --filter contracts compile:viewer"

[tasks."contract:compile:viewer:watch"]
description = "Viewer 用 OAS を監視付きで生成する"
dir = "src/app"
run = "bun --filter contracts compile:viewer:watch"

[tasks."contract:compile:admin"]
description = "Admin 用 OAS を生成する"
dir = "src/app"
run = "bun --filter contracts compile:admin"

[tasks."contract:compile:admin:watch"]
description = "Admin 用 OAS を監視付きで生成する"
dir = "src/app"
run = "bun --filter contracts compile:admin:watch"

[tasks."contract:re-compile"]
description = "contracts の OAS を生成し直す"
dir = "src/app"
run = '''
rm -rf contracts/generated/oas
bun --filter contracts compile:viewer
bun --filter contracts compile:admin
'''

# -- generate --

[tasks.generate]
description = "OAS からコードを生成する"
depends = ["api:generate", "admin:generate", "viewer:generate"]

# -- api --

[tasks."api:shell"]
description = "php コンテナの中に入る"
run = "docker compose exec php bash"

[tasks."api:composer:install"]
description = "composer パッケージをインストールする"
run = "docker compose run --rm php composer install"

[tasks."api:composer:dump"]
description = "autoloader を更新する"
run = "docker compose exec -T php composer dump-autoload"

[tasks."api:generate"]
description = "OAS からサーバーのコードを生成する"
depends = ["api:generate:*"]

[tasks."api:generate:admin"]
description = "OAS から Admin のコードを生成する"
run = '''
rm -rf ./src/app/server/Generated/Admin

docker run --rm -u {{vars.uid}}:{{vars.gid}} -v ".:/local" ${OPENAPI_IMAGE} generate \
  -i /local/src/app/contracts/generated/oas/${ADMIN_OAS_FILE} \
  -g php \
  -t /local/src/app/server/tools/openapi-generator/templates \
  -o /local/src/app/server/Generated/Admin \
  -p invokerPackage=OpenAPI\\Admin\\Client
'''

[tasks."api:generate:viewer"]
description = "OAS から Viewer のコードを生成する"
run = '''
rm -rf ./src/app/server/Generated/Viewer

docker run --rm -u {{vars.uid}}:{{vars.gid}} -v ".:/local" ${OPENAPI_IMAGE} generate \
  -i /local/src/app/contracts/generated/oas/${VIEWER_OAS_FILE} \
  -g php \
  -t /local/src/app/server/tools/openapi-generator/templates \
  -o /local/src/app/server/Generated/Viewer \
  -p invokerPackage=OpenAPI\\Viewer\\Client
'''

[tasks."api:phpstan"]
description = "PHPStan を実行する"
usage = 'arg "[path]" var=#true help="静的解析対象パス"'
run = "docker compose exec php composer phpstan ${usage_path}"

[tasks."api:phpstan:clear-cache"]
description = "PHPStan のキャッシュを削除する"
run = "docker compose exec php composer phpstan-clear-cache"

[tasks."api:arkitect"]
description = "PHPArkitect を実行する"
run = "docker compose exec php composer arkitect"

[tasks."api:ecs"]
description = "ECS を実行し、コードフォーマットをチェックする"
usage = 'arg "[path]" var=#true help="フォーマットチェック対象パス"'
run = "docker compose exec php composer ecs ${usage_path}"

[tasks."api:ecs:fix"]
description = "ECS を実行し、フォーマットを自動修正する"
usage = 'arg "[path]" var=#true help="フォーマット自動修正対象パス"'
run = "docker compose exec php composer ecs-fix ${usage_path}"

[tasks."api:test"]
description = "テストを実行する"
usage = '''
arg "[path]" var=#true help="テスト対象パス"
'''
run = "docker compose exec php ./vendor/bin/paratest ${usage_path}"

[tasks."api:test:all"]
description = "すべてのテストを実行する"
run = "docker compose exec php composer test-all"

[tasks."api:test:unit"]
description = "Unit テストを実行する"
run = "docker compose exec php composer test-unit"

[tasks."api:test:integration"]
description = "Integration テストを実行する"
run = "docker compose exec php composer test-integration"

[tasks."api:test:feature"]
description = "Feature テストを実行する"
run = "docker compose exec php composer test-feature"

[tasks."api:coverage"]
description = "テストカバレッジを出力する"
run = "docker compose exec php composer coverage"

[tasks."api:infection"]
description = "ミューテーションテストを実行する"
run = "docker compose exec php composer infection"

[tasks."api:metrics"]
description = "コードメトリクスを出力する"
run = "docker compose exec php composer metrics"

[tasks."api:tinker"]
description = "Laravel tinker を実行する"
run = "docker compose exec php php artisan tinker"

# -- migrate --

[tasks.migrate]
description = "スキーマをデータベースに適用する"
depends = ["migrate:local", "migrate:testing"]

[tasks."migrate:local"]
description = "スキーマを local データベースに適用する"
dir = "src/app/server/database"
run = 'atlas schema apply --env local --var "schema_name=${DB_DATABASE}"'

[tasks."migrate:local".env]
_.file = "src/app/server/.env"

[tasks."migrate:testing"]
description = "スキーマを testing データベースに適用する"
dir = "src/app/server/database"
run = 'atlas schema apply --env testing --var "schema_name=${DB_DATABASE}"'

[tasks."migrate:testing".env]
_.file = "src/app/server/.env.testing"

[tasks."migrate:dry-run"]
quiet = true
description = "適用されるスキーマの差分を確認する(適用はしない)"
dir = "src/app/server/database"
run = 'atlas schema apply --env local --var "schema_name=${DB_DATABASE}" --dry-run'

[tasks."migrate:dry-run".env]
_.file = "src/app/server/.env"

# -- admin --

[tasks."admin:dev"]
description = "Admin の dev サーバーを worktree 専用ポートで起動する"
dir = "src/app"
run = "bun --filter admin dev -- --host 0.0.0.0 --port \"${WORKTREE_ADMIN_PORT:-4321}\""

[tasks."admin:generate"]
description = "OAS から Admin のコードを生成する"
dir = "src/app/admin"
run = '''
rm -rf src/generated

bun run generate:api
'''

[tasks."admin:format"]
description = "Admin の formatter を実行し、フォーマットを自動修正する"
dir = "src/app/admin"
run = [
  "bun run prettier:format",
  "bun run eslint:fix",
  "bun run stylelint:fix",
]

[tasks."admin:format:check"]
description = "Admin の formatter をチェックする"
usage = 'arg "[path]" var=#true help="Prettier のチェック対象パス (省略時は全体)"'
dir = "src/app/admin"
run = "bun x prettier --check ${usage_path:-.}"

[tasks."admin:lint"]
description = "Admin の linter を実行する"
dir = "src/app/admin"
run = [
  "bun run eslint:check",
  "bun run stylelint:check",
]

[tasks."admin:lint:fix"]
description = "Admin の ESLint を --fix オプション付きで実行する"
dir = "src/app/admin"
run = "bun run eslint:fix"

[tasks."admin:style"]
description = "Stylelint を実行する"
usage = 'arg "[path]" var=#true help="Stylelint 対象パス"'
dir = "src/app/admin"
run = "bun run stylelint:check ${usage_path}"

[tasks."admin:style:fix"]
description = "Stylelint を --fix オプション付きで実行する"
usage = 'arg "[path]" var=#true help="Stylelint 自動修正対象パス"'
dir = "src/app/admin"
run = "bun run stylelint:fix ${usage_path}"

[tasks."admin:typecheck"]
description = "Admin の TypeScript をチェックする"
dir = "src/app/admin"
run = "bun run typecheck"

[tasks."admin:fix"]
description = "Admin の formatter を実行し、フォーマットを自動修正する"
depends = ["admin:format"]

[tasks."admin:check"]
description = "Admin の formatter check / linter / typecheck を直列で実行する"
dir = "src/app/admin"
run = [
  "bun run prettier:format:check",
  "bun run eslint:check",
  "bun run stylelint:check",
  "bun run typecheck",
]

[tasks."admin:prism"]
description = "Prism のモックサーバーを起動する"
dir = "src/app"
run = "bun --filter admin prism"

# -- viewer --

[tasks."viewer:dev"]
description = "Viewer の dev サーバーを worktree 専用ポートで起動する"
dir = "src/app"
run = "bun --filter viewer dev -- --host 0.0.0.0 --port \"${WORKTREE_VIEWER_PORT:-3000}\""

[tasks."viewer:generate"]
description = "OAS から Viewer のコードを生成する"
dir = "src/app/viewer"
run = '''
rm -rf src/generated

bun run generate:api
'''

[tasks."viewer:format"]
description = "Viewer の formatter を実行し、フォーマットを自動修正する"
dir = "src/app/viewer"
run = [
  "bun run prettier:format",
  "bun run eslint:fix",
  "bun run stylelint:fix",
]

[tasks."viewer:format:check"]
description = "Viewer の formatter をチェックする"
usage = 'arg "[path]" var=#true help="Prettier のチェック対象パス (省略時は全体)"'
dir = "src/app/viewer"
run = "bun x prettier --check ${usage_path:-.}"

[tasks."viewer:lint"]
description = "Viewer の linter を実行する"
dir = "src/app/viewer"
run = [
  "bun run eslint:check",
  "bun run stylelint:check",
]

[tasks."viewer:lint:fix"]
description = "Viewer の ESLint を --fix オプション付きで実行する"
dir = "src/app/viewer"
run = "bun run eslint:fix"

[tasks."viewer:style"]
description = "Stylelint を実行する"
usage = 'arg "[path]" var=#true help="Stylelint 対象パス"'
dir = "src/app/viewer"
run = "bun run stylelint:check ${usage_path}"

[tasks."viewer:style:fix"]
description = "Stylelint を --fix オプション付きで実行する"
usage = 'arg "[path]" var=#true help="Stylelint 自動修正対象パス"'
dir = "src/app/viewer"
run = "bun run stylelint:fix ${usage_path}"

[tasks."viewer:typecheck"]
description = "Viewer の TypeScript をチェックする"
dir = "src/app/viewer"
run = "bun run typecheck"

[tasks."viewer:fix"]
description = "Viewer の formatter を実行し、フォーマットを自動修正する"
depends = ["viewer:format"]

[tasks."viewer:check"]
description = "Viewer の formatter check / linter / typecheck を直列で実行する"
dir = "src/app/viewer"
run = [
  "bun run prettier:format:check",
  "bun run eslint:check",
  "bun run stylelint:check",
  "bun run typecheck",
]

# -- Notify Contract --

[tasks."notify-contract:test"]
description = "notify-contract の moon test を実行する"
dir = "src/notification/contract"
run = "moon test"

[tasks."notify-contract:check"]
description = "notify-contract の check / test を実行する"
dir = "src/notification/contract"
run = [
  "moon check",
  "moon test",
]

# -- Discord Notifier --

[tasks."discord-notifier:test"]
description = "discord-notifier の moon test を実行する"
dir = "src/notification/discord-notifier"
run = "moon test"

[tasks."discord-notifier:build"]
description = "discord-notifier を native release ビルドする"
dir = "src/notification/discord-notifier"
run = "moon build --target native --release"

[tasks."discord-notifier:check"]
description = "discord-notifier の check / test / native build を実行する"
dir = "src/notification/discord-notifier"
run = [
  "moon check",
  "moon test",
  "moon build --target native --release",
]

# -- Notify Publish --

[tasks."notify-publish:test"]
description = "notify-publish の moon test を実行する"
dir = "src/notification/publish"
run = "moon test"

[tasks."notify-publish:build"]
description = "notify-publish を native release ビルドする"
dir = "src/notification/publish"
run = "moon build --target native --release"

[tasks."notify-publish:check"]
description = "notify-publish の check / test / native build を実行する"
dir = "src/notification/publish"
run = [
  "moon check",
  "moon test",
  "moon build --target native --release",
]

# -- Admin Proxy --

[tasks."admin-proxy:format"]
description = "admin-proxy の formatter を実行し、フォーマットを自動修正する"
dir = "src/app/admin-proxy"
run = "bun run format"

[tasks."admin-proxy:format:check"]
description = "admin-proxy の formatter をチェックする"
dir = "src/app/admin-proxy"
run = "bun run format:check"

[tasks."admin-proxy:lint"]
description = "admin-proxy の linter を実行する"
dir = "src/app/admin-proxy"
run = "bun run lint:check"

[tasks."admin-proxy:typecheck"]
description = "admin-proxy の TypeScript をチェックする"
dir = "src/app/admin-proxy"
run = "bun run typecheck"

[tasks."admin-proxy:check"]
description = "admin-proxy の format / lint / typecheck を実行する"
depends = ["admin-proxy:format:check", "admin-proxy:lint", "admin-proxy:typecheck"]
