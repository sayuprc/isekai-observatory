steps:
  - id: build-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ["-"]
    env:
      - REGISTRY=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}
      - TAG=$COMMIT_SHA
      - DEPLOY_ENV=development
      - PUBLIC_APP_URL=${_PUBLIC_APP_URL}
      - API_IMAGE=${_API_IMAGE}
      - CLI_IMAGE=${_CLI_IMAGE}
      - DB_MIGRATE_IMAGE=${_DB_MIGRATE_IMAGE}
      - DISCORD_NOTIFIER_IMAGE=${_DISCORD_NOTIFIER_IMAGE}
      - ADMIN_IMAGE=${_ADMIN_IMAGE}
      - VIEWER_IMAGE=${_VIEWER_IMAGE}
      - ADMIN_PROXY_IMAGE=${_ADMIN_PROXY_IMAGE}
    args:
      - -eu
      - -c
      - |
        MOONBIT_VERSION="$$(./tools/read-mise-value.sh moonbit_version)" \
          docker buildx bake -f docker-bake.hcl --push

  # TODO マイグレーションを別で行う
  - id: deploy-db-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - jobs
      - deploy
      - dev-db-migrate
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DB_MIGRATE_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      # - --wait
      - --quiet

  - id: deploy-admin-invite
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - jobs
      - deploy
      - dev-admin-invite
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      - --quiet

  - id: deploy-media-youtube-import
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - jobs
      - deploy
      - dev-media-youtube-import
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_CLI_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      - --command
      - php,artisan,media:youtube:import
      - --quiet

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - deploy
      - dev-isekai-api
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_API_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_API_SERVICE_ACCOUNT}
      - --ingress
      - ${_API_INGRESS}
      - --scaling=auto
      - --max=1
      - --quiet

  - id: deploy-discord-notifier
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - deploy
      - dev-isekai-discord-notifier
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_DISCORD_NOTIFIER_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_NOTIFY_SERVICE_ACCOUNT}
      - --quiet

  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - deploy
      - dev-isekai-admin
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_ADMIN_SERVICE_ACCOUNT}
      - --ingress
      - ${_ADMIN_INGRESS}
      - --scaling=auto
      - --max=1
      - --quiet

  # TODO デプロイは別に行う
  - id: deploy-viewer
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - jobs
      - deploy
      - dev-viewer-deploy
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_VIEWER_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      # - --wait
      - --quiet

  - id: deploy-admin-proxy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor:
      - build-images
    args:
      - run
      - jobs
      - deploy
      - dev-admin-proxy-deploy
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_ADMIN_PROXY_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --service-account
      - ${_JOB_SERVICE_ACCOUNT}
      - --wait
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
  # 費用を抑えるためにスペックを下げる
  # 費用と効果が見合うかを改めて試算してから設定する
  machineType: "E2_HIGHCPU_8"
