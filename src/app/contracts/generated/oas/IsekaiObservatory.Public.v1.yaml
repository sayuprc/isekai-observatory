openapi: 3.1.0
info:
  title: ヰ世界観測所 Public API
  version: v1
tags:
  - name: Event
  - name: Media
  - name: Person
  - name: PersonGroup
  - name: ReleaseGroup
  - name: Song
  - name: Venue
paths:
  /events:
    get:
      operationId: EventService_listEvents
      description: イベント一覧取得API
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageToken'
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Event
  /media:
    get:
      operationId: MediaService_listMedia
      description: メディア一覧取得API
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageToken'
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Media
  /people:
    get:
      operationId: PersonService_listPeople
      description: 人物一覧取得API
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageToken'
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Person
  /person-groups:
    get:
      operationId: PersonGroupService_listPersonGroups
      description: 人物グループ一覧取得API
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageToken'
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonGroupListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - PersonGroup
  /release-groups:
    get:
      operationId: ReleaseGroupService_listReleaseGroups
      description: リリースグループ一覧取得API
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageToken'
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseGroupListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - ReleaseGroup
  /songs:
    get:
      operationId: SongService_listSongs
      description: 楽曲一覧取得API
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageToken'
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Song
  /venues:
    get:
      operationId: VenueService_listVenues
      description: 開催先一覧取得API
      parameters:
        - name: pageToken
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageToken'
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/pageSize'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Venue
components:
  schemas:
    CoVocalist:
      type: object
      required:
        - personId
        - creditName
        - personGroupId
      properties:
        personId:
          $ref: '#/components/schemas/personId'
        creditName:
          anyOf:
            - $ref: '#/components/schemas/performanceCreditName'
            - type: 'null'
        personGroupId:
          anyOf:
            - $ref: '#/components/schemas/personGroupId'
            - type: 'null'
      description: 楽曲披露の共演者。personGroupId はグループとして全員で出演したときだけ持つ
    ErrorCode:
      type: string
      enum:
        - unauthenticated
        - permission_denied
        - not_found
        - validation_failed
        - business_rule_violation
        - internal_error
      description: エラー分類を表す機械可読なコード
      x-enum-varnames:
        - Unauthenticated
        - PermissionDenied
        - NotFound
        - ValidationFailed
        - BusinessRuleViolation
        - InternalError
      x-enum-descriptions:
        - 認証されていない (401)
        - 権限がない (403)
        - 対象が見つからない (404)
        - 入力形式の検証に失敗した (422)
        - 業務ルールに違反した (400)
        - 予期しないエラーが発生した (500)
    ErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
      description: フィールド単位のエラー詳細
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      description: 全エラーステータス共通のレスポンス
    Event:
      type: object
      required:
        - eventId
        - title
        - description
        - type
        - schedule
        - status
        - venueIds
        - mediaIds
        - releaseIds
        - sources
        - performances
        - setlist
      properties:
        eventId:
          $ref: '#/components/schemas/eventId'
        title:
          $ref: '#/components/schemas/eventTitle'
        description:
          $ref: '#/components/schemas/eventDescription'
        type:
          $ref: '#/components/schemas/EventTypeValue'
        schedule:
          $ref: '#/components/schemas/IsekaiObservatory.Packages.Event.EventSchedule'
        status:
          $ref: '#/components/schemas/EventStatusValue'
        venueIds:
          type: array
          items:
            $ref: '#/components/schemas/venueId'
          description: 開催先の ID (表示順)
        mediaIds:
          type: array
          items:
            $ref: '#/components/schemas/mediaId'
          description: 関連する公開メディアの ID (表示順)
        releaseIds:
          type: array
          items:
            $ref: '#/components/schemas/releaseId'
          description: 関連リリースの ID (表示順)。リリースとリリースグループがともに公開のものだけが載る
        sources:
          type: array
          items:
            $ref: '#/components/schemas/EventSource'
          description: 出典 (表示順)
        performances:
          type: array
          items:
            $ref: '#/components/schemas/SongPerformance'
          description: 楽曲披露。セットリスト項目に属さないものも含む
        setlist:
          type: array
          items:
            $ref: '#/components/schemas/SetlistItem'
          description: セットリスト (表示順)
      description: 公開イベント
    EventListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        nextPageToken:
          $ref: '#/components/schemas/pageToken'
          description: 続きがある場合のみ返す
    EventSource:
      type: object
      required:
        - displayName
        - url
      properties:
        displayName:
          $ref: '#/components/schemas/eventSourceName'
        url:
          $ref: '#/components/schemas/eventSourceUrl'
      description: 出典
    EventStatusValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
      description: イベントの開催状態。通常・延期・中止を表す。予定・開催済みは開催時期から導出する
      x-enum-varnames:
        - Normal
        - Postponed
        - Cancelled
      x-enum-descriptions:
        - 通常
        - 延期
        - 中止
    EventTypeValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
        - 4
        - 99
      description: イベント種別
      x-enum-varnames:
        - Live
        - Stream
        - Exhibition
        - Radio
        - Other
      x-enum-descriptions:
        - ライブ
        - 配信
        - 展覧会
        - ラジオ
        - その他
    IsekaiObservatory.Packages.Event.EventSchedule:
      type: object
      required:
        - startOn
        - endOn
      properties:
        startOn:
          anyOf:
            - $ref: '#/components/schemas/eventOn'
            - type: 'null'
        endOn:
          anyOf:
            - $ref: '#/components/schemas/eventOn'
            - type: 'null'
      description: イベントの開催時期。両方 null は日付未定、startOn のみは単日、両方指定は期間を表す
    IsekaiObservatory.Public.Version:
      type: string
      enum:
        - v1
      x-enum-varnames:
        - v1
      x-enum-descriptions:
        - バージョン 1
    Media:
      type: object
      required:
        - mediaId
        - title
        - url
        - publishedAt
        - type
      properties:
        mediaId:
          $ref: '#/components/schemas/mediaId'
        title:
          $ref: '#/components/schemas/mediaTitle'
        url:
          $ref: '#/components/schemas/mediaUrl'
        publishedAt:
          $ref: '#/components/schemas/mediaPublishedAt'
        type:
          $ref: '#/components/schemas/MediaTypeValue'
      description: 公開メディア
    MediaListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        nextPageToken:
          $ref: '#/components/schemas/pageToken'
          description: 続きがある場合のみ返す
    MediaTypeValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 99
      description: メディア種別の値
      x-enum-varnames:
        - Mv
        - AudioVideo
        - LiveStream
        - Short
        - Post
        - Other
      x-enum-descriptions:
        - MV
        - 音源動画
        - 配信
        - ショート
        - 投稿
        - その他
    Person:
      type: object
      required:
        - personId
        - name
      properties:
        personId:
          $ref: '#/components/schemas/personId'
        name:
          type: string
      description: 人物。公開楽曲のクレジット、公開イベントの共演者、公開人物グループのメンバーとして参照されているものだけが載る
    PersonGroup:
      type: object
      required:
        - personGroupId
        - name
        - memberIds
      properties:
        personGroupId:
          $ref: '#/components/schemas/personGroupId'
        name:
          type: string
        memberIds:
          type: array
          items:
            $ref: '#/components/schemas/personId'
          description: メンバーの人物 ID (表示順)
      description: 人物グループ。公開イベントの共演者の出演グループとして参照されているものだけが載る
    PersonGroupListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonGroup'
        nextPageToken:
          $ref: '#/components/schemas/pageToken'
          description: 続きがある場合のみ返す
    PersonListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        nextPageToken:
          $ref: '#/components/schemas/pageToken'
          description: 続きがある場合のみ返す
    Release:
      type: object
      required:
        - releaseId
        - name
        - releasedOn
        - description
        - color
        - formats
        - media
      properties:
        releaseId:
          $ref: '#/components/schemas/releaseId'
        name:
          type: string
          description: 版名。無しは空文字
        releasedOn:
          $ref: '#/components/schemas/releasedOn'
        description:
          type: string
        color:
          $ref: '#/components/schemas/color'
        formats:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseFormatValue'
        media:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseMedium'
      description: 公開リリース (版)
    ReleaseFormatValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
        - 4
        - 99
      description: 提供形態の値
      x-enum-varnames:
        - Digital
        - Cd
        - Dvd
        - BluRay
        - Other
      x-enum-descriptions:
        - 配信
        - CD
        - DVD
        - Blu-ray
        - その他
    ReleaseGroup:
      type: object
      required:
        - releaseGroupId
        - title
        - type
        - description
        - releases
      properties:
        releaseGroupId:
          $ref: '#/components/schemas/releaseGroupId'
        title:
          type: string
        type:
          $ref: '#/components/schemas/ReleaseGroupTypeValue'
        description:
          type: string
        releases:
          type: array
          items:
            $ref: '#/components/schemas/Release'
          description: 公開リリース (表示順)
      description: リリースグループ。公開リリースを 1 件以上持つものだけが載る
    ReleaseGroupListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseGroup'
        nextPageToken:
          $ref: '#/components/schemas/pageToken'
          description: 続きがある場合のみ返す
    ReleaseGroupTypeValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
        - 99
      description: リリースグループ種別の値
      x-enum-varnames:
        - Single
        - Album
        - Ep
        - Other
      x-enum-descriptions:
        - シングル
        - アルバム
        - EP
        - その他
    ReleaseMedium:
      type: object
      required:
        - position
        - name
        - tracks
      properties:
        position:
          $ref: '#/components/schemas/orderNo'
        name:
          anyOf:
            - type: string
            - type: 'null'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseTrack'
      description: リリース内の区切り (Disc など)
    ReleaseTrack:
      type: object
      required:
        - trackNo
        - songId
        - title
      properties:
        trackNo:
          $ref: '#/components/schemas/orderNo'
        songId:
          anyOf:
            - $ref: '#/components/schemas/songId'
            - type: 'null'
        title:
          type: string
      description: 収録トラック。title は上書き名があればそれ、なければ楽曲名。楽曲を参照しないトラックと非公開楽曲のトラックは songId が null になる
    SetlistItem:
      type: object
      required:
        - label
        - performanceIds
      properties:
        label:
          anyOf:
            - $ref: '#/components/schemas/setlistLabel'
            - type: 'null'
        performanceIds:
          type: array
          items:
            $ref: '#/components/schemas/performanceId'
          description: この項目で披露した楽曲披露の ID。メドレーでは複数になる
      description: セットリスト項目。本人が歌唱しない演目は label だけを持つ
    Song:
      type: object
      required:
        - songId
        - title
        - description
        - type
        - credits
        - mediaIds
      properties:
        songId:
          $ref: '#/components/schemas/songId'
        title:
          $ref: '#/components/schemas/title'
        description:
          $ref: '#/components/schemas/description'
        type:
          $ref: '#/components/schemas/SongTypeValue'
        credits:
          type: array
          items:
            $ref: '#/components/schemas/SongCredit'
          description: クレジット (表示順)
        mediaIds:
          type: array
          items:
            $ref: '#/components/schemas/mediaId'
          description: 関連する公開メディアの ID (表示順)
      description: 公開楽曲
    SongCredit:
      type: object
      required:
        - personId
        - role
      properties:
        personId:
          $ref: '#/components/schemas/personId'
        role:
          $ref: '#/components/schemas/SongCreditRoleValue'
      description: 人物が楽曲に関わった役割。同じ人物が複数の役割で載ることがある
    SongCreditRoleValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
      description: クレジットの役割
      x-enum-varnames:
        - Lyricist
        - Composer
        - Arranger
      x-enum-descriptions:
        - 作詞
        - 作曲
        - 編曲
    SongListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Song'
        nextPageToken:
          $ref: '#/components/schemas/pageToken'
          description: 続きがある場合のみ返す
    SongPerformance:
      type: object
      required:
        - performanceId
        - songId
        - songTitle
        - coVocalists
      properties:
        performanceId:
          $ref: '#/components/schemas/performanceId'
        songId:
          anyOf:
            - $ref: '#/components/schemas/songId'
            - type: 'null'
        songTitle:
          $ref: '#/components/schemas/title'
        coVocalists:
          type: array
          items:
            $ref: '#/components/schemas/CoVocalist'
          description: 共演者 (表示順)
      description: 楽曲披露。参照先の楽曲が非公開なら songId は null になり、songTitle だけが載る
    SongTypeValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
      description: 楽曲種別の値
      x-enum-varnames:
        - Original
        - Cover
      x-enum-descriptions:
        - オリジナル曲
        - カバー曲
    Venue:
      type: object
      required:
        - venueId
        - name
        - kind
      properties:
        venueId:
          $ref: '#/components/schemas/venueId'
        name:
          type: string
        kind:
          $ref: '#/components/schemas/VenueKindValue'
      description: 開催先。公開イベントから参照されているものだけが載る
    VenueKindValue:
      type: integer
      format: int32
      enum:
        - 1
        - 2
      description: 開催先種別の値
      x-enum-varnames:
        - Physical
        - Online
      x-enum-descriptions:
        - 現地
        - オンライン
    VenueListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        nextPageToken:
          $ref: '#/components/schemas/pageToken'
          description: 続きがある場合のみ返す
    Version:
      type: string
      enum:
        - v1
      x-enum-varnames:
        - v1
      x-enum-descriptions:
        - バージョン 1
    color:
      type: string
      pattern: ^#[0-9a-f]{6}$
      description: 代表色
    description:
      type: string
      description: 楽曲の説明
    eventDescription:
      type: string
      description: イベント説明
    eventId:
      type: string
      format: uuid
      description: イベントID
    eventOn:
      type: string
      format: date
      description: イベント日
    eventSourceName:
      type: string
      minLength: 1
      description: イベントの出典表示名
    eventSourceUrl:
      type: string
      format: uri
      description: イベントの出典URL
    eventTitle:
      type: string
      minLength: 1
      description: イベントタイトル
    mediaId:
      type: string
      format: uuid
      description: メディアID
    mediaPublishedAt:
      type: string
      format: date-time
      description: 公開日時
    mediaTitle:
      type: string
      minLength: 1
      description: メディアタイトル
    mediaUrl:
      type: string
      format: uri
      description: メディアURL
    orderNo:
      type: integer
      format: int32
      minimum: 1
      description: 表示順
    pageSize:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      description: 1 ページあたりの件数
    pageToken:
      type: string
