components:
  schemas:
    AdminUser:
      type: object
      required:
        - adminUserId
        - name
        - email
        - createdAt
        - role
        - permissions
      properties:
        adminUserId:
          $ref: '#/components/schemas/adminUserId'
        name:
          $ref: '#/components/schemas/adminUserName'
        email:
          $ref: '#/components/schemas/email'
        createdAt:
          $ref: '#/components/schemas/createdAt'
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      examples:
        - adminUserId: 0cc5f492-22fe-4f38-b702-8b2375bc0254
          name: テスト管理ユーザー
          email: example@example.com
          createdAt: '2019-12-09T10:30:20+09:00'
          role:
            name: 一般
            value: 3
          permissions:
            - name: 管理ユーザー読み取り
              value: read_admin_user
    AdminUserListResponse:
      type: object
      required:
        - adminUsers
      properties:
        adminUsers:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    AuditAction:
      type: string
      enum:
        - create
        - update
        - delete
        - register
        - login
        - refresh
        - recovery_code_issue
        - recovery_code_use
      description: 監査ログの操作種別
    AuditLog:
      type: object
      required:
        - auditLogId
        - adminUserId
        - adminUserName
        - action
        - targetType
        - targetId
        - createdAt
        - snapshot
      properties:
        auditLogId:
          $ref: '#/components/schemas/auditLogId'
        adminUserId:
          $ref: '#/components/schemas/uuid'
        adminUserName:
          type: string
        action:
          $ref: '#/components/schemas/AuditAction'
        targetType:
          $ref: '#/components/schemas/AuditTargetType'
        targetId:
