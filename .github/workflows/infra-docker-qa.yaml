name: Infra Docker QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    # main, stg 向け PR は release-qa 経由で必ず全実行する
    branches-ignore:
      - main
      - stg
    paths:
      - "infra/docker/**"
      - "docker-bake.hcl"
      - "mise.toml"
      - "tools/read-mise-value.sh"
      - ".github/workflows/infra-docker-qa.yaml"
  push:
    branches:
      - dev
    paths:
      - "infra/docker/**"
      - "docker-bake.hcl"
      - "mise.toml"
      - "tools/read-mise-value.sh"
      - ".github/workflows/infra-docker-qa.yaml"
  workflow_call:

permissions:
  contents: read

jobs:
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Build images
        env:
          # 環境ごとの差は DEPLOY_ENV だけなので、QA ではどれか 1 つの値でビルドできれば十分
          DEPLOY_ENV: development
          PUBLIC_APP_URL: https://example.invalid
        run: |
          set -euo pipefail

          MOONBIT_VERSION="$(./tools/read-mise-value.sh moonbit_version)" \
            docker buildx bake -f docker-bake.hcl
