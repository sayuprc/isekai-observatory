name: Infra Docker QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    # main, stg 向け PR は release-qa 経由で必ず全実行する
    branches-ignore:
      - main
      - stg
    paths:
      - "infra/docker/**"
      - "mise.toml"
      - "tools/read-mise-value.sh"
      - ".github/workflows/infra-docker-qa.yaml"
  push:
    branches:
      - dev
    paths:
      - "infra/docker/**"
      - "mise.toml"
      - "tools/read-mise-value.sh"
      - ".github/workflows/infra-docker-qa.yaml"
  workflow_call:

permissions:
  contents: read

jobs:
  docker-build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - api
          - cli
          - db-migrate
          - discord-notifier
          - admin
          - viewer
          - admin-proxy
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          dockerfile="infra/docker/${IMAGE}/Dockerfile"
          tag="infra-qa-${IMAGE}:local"
          extra_args=()

          if [[ "${IMAGE}" == "admin" ]]; then
            extra_args+=(--build-arg "PUBLIC_APP_URL=https://example.invalid")
          fi

          # 環境ごとの差は DEPLOY_ENV だけなので、QA ではどれか 1 つの値でビルドできれば十分
          if [[ "${IMAGE}" == "admin" || "${IMAGE}" == "admin-proxy" || "${IMAGE}" == "db-migrate" || "${IMAGE}" == "viewer" ]]; then
            extra_args+=(--build-arg "DEPLOY_ENV=development")
          fi

          if [[ "${IMAGE}" == "discord-notifier" || "${IMAGE}" == "viewer" ]]; then
            extra_args+=(--build-arg "MOONBIT_VERSION=$(./tools/read-mise-value.sh moonbit_version)")
          fi

          docker build \
            -f "${dockerfile}" \
            -t "${tag}" \
            "${extra_args[@]}" \
            .
