name: Infra Docker QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    # main, stg 向け PR は release-qa 経由で必ず全実行する
    branches-ignore:
      - main
      - stg
    paths:
      - "infra/development/**"
      - "infra/staging/**"
      - "infra/production/**"
      - ".github/workflows/infra-docker-qa.yaml"
  push:
    branches:
      - dev
    paths:
      - "infra/development/**"
      - "infra/staging/**"
      - "infra/production/**"
      - ".github/workflows/infra-docker-qa.yaml"
  workflow_call:

permissions:
  contents: read

jobs:
  docker-build:
    name: ${{ matrix.env }} / ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - development
          - staging
          - production
        image:
          - api
          - cli
          - db-migrate
          - discord-notifier
          - admin
          - viewer
          - admin-proxy
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Build image
        env:
          ENV_NAME: ${{ matrix.env }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          dockerfile="infra/${ENV_NAME}/docker/${IMAGE}/Dockerfile"
          tag="infra-qa-${ENV_NAME}-${IMAGE}:local"
          extra_args=()

          if [[ "${IMAGE}" == "admin" ]]; then
            extra_args+=(--build-arg "PUBLIC_APP_URL=https://example.invalid")
          fi

          docker build \
            -f "${dockerfile}" \
            -t "${tag}" \
            "${extra_args[@]}" \
            .
