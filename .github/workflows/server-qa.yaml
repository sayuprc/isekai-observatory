name: Server QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    # main, stg 向け PR は release-qa 経由で必ず全実行する
    branches-ignore:
      - main
      - stg
    paths:
      - "src/app/server/**"
      - "src/app/contracts/**"
      - "infra/local/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/server-qa.yaml"
      - ".github/actions/setup-mise/**"
  push:
    branches:
      - dev
    paths:
      - "src/app/server/**"
      - "src/app/contracts/**"
      - "infra/local/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/server-qa.yaml"
      - ".github/actions/setup-mise/**"
  workflow_call:

env:
  MISE_ENV: ci
  SERVER_DOCKER_PATH: /tmp/cache/docker/server
  OPENAPI_GENERATOR_CLI_DOCKER_PATH: /tmp/cache/docker/openapi-generator-cli
  MYSQL_DOCKER_PATH: /tmp/cache/docker/mysql
  VENDOR_PATH: ./src/app/server/vendor

permissions:
  contents: read
  packages: write

jobs:
  setup:
    name: Setup server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache server docker image
        id: cache-server-docker-image
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.SERVER_DOCKER_PATH }}
          key: docker-server-${{ env.SERVER_IMAGE }}-${{ hashFiles('./infra/local/docker/php/Dockerfile') }}

      - name: Build server image
        if: steps.cache-server-docker-image.outputs.cache-hit != 'true'
        run: |
          mise run build:php
          mkdir -p "${SERVER_DOCKER_PATH}"

      - name: Cache openapi-generator-cli docker image
        id: cache-openapi-generator-cli-docker-image
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.OPENAPI_GENERATOR_CLI_DOCKER_PATH }}
          key: docker-openapi-generator-cli-${{ env.OPENAPI_IMAGE }}-${{ hashFiles('./infra/local/docker/openapi-generator/Dockerfile') }}

      - name: Build openapi-generator-cli image
        if: steps.cache-openapi-generator-cli-docker-image.outputs.cache-hit != 'true'
        run: |
          mise run build:openapi-generator
          mkdir -p "${OPENAPI_GENERATOR_CLI_DOCKER_PATH}"

      - name: Cache mysql docker image
        id: cache-mysql-docker-image
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.MYSQL_DOCKER_PATH }}
          key: docker-mysql-${{ env.MYSQL_IMAGE }}-${{ hashFiles('./infra/local/docker/mysql/Dockerfile', './infra/local/docker/mysql/my.cnf', './infra/local/docker/mysql/init/*') }}

      - name: Build mysql image
        if: steps.cache-mysql-docker-image.outputs.cache-hit != 'true'
        run: |
          mise run build:mysql
          mkdir -p "${MYSQL_DOCKER_PATH}"

      - name: Copy .env
        run: cp src/app/server/.env.example src/app/server/.env

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.VENDOR_PATH }}
          key: composer-${{ hashFiles('./src/app/server/composer.*') }}

      - name: Composer install
        run: mise run api:install

      - name: Dump autoload
        run: mise run api:autoload

      - name: Check generate code has diff
        run: |
          mise run api:generate

          if [ -n "$(git status --porcelain)" ]; then
            echo "自動生成コードに差分があります"
            git status
            exit 1
          fi

  architecture:
    needs: setup
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.VENDOR_PATH }}
          key: composer-${{ hashFiles('./src/app/server/composer.*') }}

      - name: Run Architecture Check
        run: mise run api:architecture

  format:
    needs: setup
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.VENDOR_PATH }}
          key: composer-${{ hashFiles('./src/app/server/composer.*') }}

      - name: Run Format Check
        run: mise run api:format:check

  lint:
    needs: setup
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      # mago はホスト側で動くのでコンテナは起動しない
      # vendor は mago.toml の includes でシンボル解決に使うため復元する
      - name: Cache composer
        id: cache-composer
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.VENDOR_PATH }}
          key: composer-${{ hashFiles('./src/app/server/composer.*') }}

      - name: Run Lint
        run: mise run api:lint:check

  analyze:
    needs: setup
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Container
        run: mise run up

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.VENDOR_PATH }}
          key: composer-${{ hashFiles('./src/app/server/composer.*') }}

      - name: Run Static Analysis
        run: mise run api:analyze

  complexity:
    needs: setup
    # release-qa 経由の main, stg 向け PR は差分が大きくレポートの意味が薄いため対象外にする
    if: github.event_name == 'pull_request' && github.workflow == 'Server QA'
    name: Cognitive Complexity Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      COMMENT_MARKER: "<!-- server-complexity-report -->"
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Collect changed PHP files
        id: changed
        run: |
          gh pr diff "${PR_NUMBER}" --name-only \
            | grep -E '^src/app/server/(app|packages)/.+\.php$' \
            | while read -r f; do [ -f "$f" ] && echo "${f#src/app/server/}"; done \
            > "${RUNNER_TEMP}/changed.txt" || true
          echo "count=$(wc -l < "${RUNNER_TEMP}/changed.txt")" >> "$GITHUB_OUTPUT"

      - name: Setup mise
        if: steps.changed.outputs.count != '0'
        uses: $/.github/actions/setup-mise

      - name: Login to GHCR
        if: steps.changed.outputs.count != '0'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Container
        if: steps.changed.outputs.count != '0'
        run: mise run up

      - name: Cache composer
        if: steps.changed.outputs.count != '0'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.VENDOR_PATH }}
          key: composer-${{ hashFiles('./src/app/server/composer.*') }}

      - name: Measure cognitive complexity
        if: steps.changed.outputs.count != '0'
        run: |
          # 違反があると phpstan は exit 1 を返すが、レポートのみが目的なので失敗扱いにしない
          mapfile -t files < "${RUNNER_TEMP}/changed.txt"
          mise exec -- docker compose exec -T php composer complexity -- --error-format=json "${files[@]}" \
            > "${RUNNER_TEMP}/complexity.json" || true
          jq -e '.files' "${RUNNER_TEMP}/complexity.json" > /dev/null

      - name: Build report
        id: report
        run: |
          json="${RUNNER_TEMP}/complexity.json"
          [ -s "$json" ] || echo '{"files":{}}' > "$json"

          rows=$(jq -r --arg base "https://github.com/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/src/app/server/" '
            .files | to_entries[] | (.key | sub("^/var/www/html/"; "")) as $path
            | .value.messages[] | select(.identifier | startswith("complexity."))
            | "| [\($path):\(.line)](\($base)\($path)#L\(.line)) | \(.message | gsub("\\|"; "\\|")) |"
          ' "$json")

          {
            echo "${COMMENT_MARKER}"
            echo "## 認知的複雑度レポート"
            echo
            if [ -z "$rows" ]; then
              echo "変更されたファイルに閾値を超える箇所はありません"
              echo "violations=false" >> "$GITHUB_OUTPUT"
            else
              echo "変更されたファイルで閾値を超えた箇所です。設定は \`src/app/server/phpstan-complexity.neon\` を参照してください"
              echo
              echo "| 場所 | 内容 |"
              echo "| --- | --- |"
              echo "$rows"
              echo "violations=true" >> "$GITHUB_OUTPUT"
            fi
          } > "${RUNNER_TEMP}/report.md"

      - name: Post report
        run: |
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${COMMENT_MARKER}\")))) | .[0].id // empty" \
            | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@"${RUNNER_TEMP}/report.md" > /dev/null
          elif [ "${{ steps.report.outputs.violations }}" = "true" ]; then
            # 違反がない PR にはコメントを増やさない
            gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/report.md"
          fi

  test:
    needs: setup
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            db: false
          - suite: integration
            db: true
          - suite: feature
            db: true
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Container
        if: ${{ !matrix.db }}
        run: mise run up

      - name: Run Container with DB
        if: ${{ matrix.db }}
        run: mise run up:test

      - name: Wait for MySQL
        if: ${{ matrix.db }}
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Cache composer
        id: cache-composer
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.VENDOR_PATH }}
          key: composer-${{ hashFiles('./src/app/server/composer.*') }}

      - name: Setup env
        run: mise run setup:env

      - name: Run migration
        if: ${{ matrix.db }}
        run: mise run migrate:local --auto-approve

      - name: Run Test
        run: mise run api:test:${{ matrix.suite }}
