name: Admin QA

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    # main, stg 向け PR は release-qa 経由で必ず全実行する
    branches-ignore:
      - main
      - stg
    paths:
      - "src/app/admin/**"
      - "src/app/contracts/**"
      - "src/app/package.json"
      - "src/app/pnpm-lock.yaml"
      - "src/app/pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/admin-qa.yaml"
      - ".github/actions/setup-mise/**"
  push:
    branches:
      - dev
    paths:
      - "src/app/admin/**"
      - "src/app/contracts/**"
      - "src/app/package.json"
      - "src/app/pnpm-lock.yaml"
      - "src/app/pnpm-workspace.yaml"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/admin-qa.yaml"
      - ".github/actions/setup-mise/**"
  workflow_call:

env:
  MISE_ENV: ci

jobs:
  diff:
    name: Generated Code Diff Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            src/app/node_modules
            src/app/admin/node_modules
          key: admin-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run app:install

      - name: Check generate code has diff
        run: mise run admin:generate

  format:
    name: Format

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            src/app/node_modules
            src/app/admin/node_modules
          key: admin-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run app:install

      - name: Run Format Check
        run: mise run admin:format:check

  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            src/app/node_modules
            src/app/admin/node_modules
          key: admin-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run app:install

      - name: Run Lint
        run: mise run admin:lint:check

  typecheck:
    name: Type Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            src/app/node_modules
            src/app/admin/node_modules
          key: admin-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run app:install

      - name: Run Type Check
        run: mise run admin:typecheck

  style:
    name: Style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup mise
        uses: $/.github/actions/setup-mise

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v6.1.0
        with:
          path: |
            src/app/node_modules
            src/app/admin/node_modules
          key: admin-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install packages
        run: mise run app:install

      - name: Run Style Check
        run: mise run admin:style:check

      # - name: Run Build
      #   run: bun run build
