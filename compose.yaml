services:
  proxy:
    image: ${PROXY_IMAGE}
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    volumes:
      - ./infra/local/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ${WORKTREE_NGINX_SITE_CONF:-./infra/local/docker/nginx/site.conf}:/etc/nginx/conf.d/site.conf
      - ./infra/local/docker/nginx/certs:/etc/nginx/certs
    ports:
      - ${WORKTREE_PROXY_HTTP_PORT:-80}:80
      - ${WORKTREE_PROXY_HTTPS_PORT:-443}:443
    extra_hosts:
      - host.docker.internal:host-gateway

  php:
    image: ${SERVER_IMAGE}
    environment:
      LANG: ja_JP.UTF-8
      TZ: Asia/Tokyo
    volumes:
      - ./src/server:/var/www/html
      - ./src/contracts:/var/www/contracts
      - ./infra/local/docker/php/php.ini:/usr/local/etc/php/php.ini

  mysql:
    image: ${MYSQL_IMAGE}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: isekai_observatory
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      TZ: Asia/Tokyo
    ports:
      - ${WORKTREE_MYSQL_PORT:-3306}:3306
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8.10
    ports:
      - ${WORKTREE_REDIS_PORT:-6379}:6379

  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    ports:
      - ${WORKTREE_REDIS_HTTP_PORT:-8079}:80
    environment:
      SRH_MODE: 'env'
      SRH_TOKEN: '${REDIS_HTTP_TOKEN:-example_token}'
      SRH_CONNECTION_STRING: 'redis://redis:6379'

volumes:
  mysql_data:
